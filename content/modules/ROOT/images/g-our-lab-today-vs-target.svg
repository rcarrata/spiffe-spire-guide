<text x="1090.0" y="406.9" font-size="16" fill="#e8590c" text-anchor="middle"><tspan x="1090.0" dy="0.0">AuthPolicy adds one CEL predicate (AND-ed in patternMatching)</tspan></text>
<text x="1090.0" y="428.1" font-size="13" fill="#5c5f66" text-anchor="middle"><tspan x="1090.0" dy="0.0">has(auth.identity.azp) &amp;&amp; auth.identity.azp == &#x27;hermes-agent&#x27;</tspan><tspan x="1090.0" dy="16.2">operator-only token -&gt; 403, exchanged token + role -&gt; allow</tspan></text>
