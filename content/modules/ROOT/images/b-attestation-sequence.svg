<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -10 1480 980" width="1480" height="980" font-family="'Red Hat Text','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect x="20" y="-10" width="1480" height="980" fill="#ffffff"/>
<text x="40.0" y="34.7" font-size="26" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" dy="0.0">Attestation: the workload sends NOTHING to prove itself</tspan></text>
<rect x="80" y="60" width="200" height="70" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
<text x="180.0" y="89.6" font-size="18" fill="#2f9e44" text-anchor="middle"><tspan x="180.0" dy="0.0">Workload</tspan><tspan x="180.0" dy="22.5">(pod)</tspan></text>
