<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -10 1180 690" width="1180" height="690" font-family="'Red Hat Text','Segoe UI',Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>
<rect x="20" y="-10" width="1180" height="690" fill="#ffffff"/>
<text x="40.0" y="34.7" font-size="26" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" dy="0.0">Anatomy of a JWT-SVID</tspan></text>
<rect x="40" y="70" width="1100" height="60" rx="10" fill="none" stroke="#1e1e1e" stroke-width="2"/>
<text x="590.0" y="104.9" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="590.0" dy="0.0">eyJhbGciOiJSUzI1NiIsImtpZCI6Ii4uLiJ9 . eyJzdWIiOiJzcGlmZmU6Ly8uLi4ifQ . c2lnbmF0dXJl</tspan></text>
<rect x="40" y="170" width="300" height="220" rx="10" fill="#ffe8cc" stroke="#e8590c" stroke-width="2"/>
<text x="190.0" y="243.0" font-size="17" fill="#e8590c" text-anchor="middle"><tspan x="190.0" dy="0.0">HEADER</tspan><tspan x="190.0" dy="21.2"> </tspan><tspan x="190.0" dy="21.2">alg: RS256</tspan><tspan x="190.0" dy="21.2">kid: fKhJk0u...</tspan><tspan x="190.0" dy="21.2">typ: JWT</tspan></text>
<rect x="380" y="170" width="460" height="220" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>
<text x="610.0" y="228.6" font-size="15" fill="#1971c2" text-anchor="middle"><tspan x="610.0" dy="0.0">PAYLOAD</tspan><tspan x="610.0" dy="18.8"> </tspan><tspan x="610.0" dy="18.8">sub: spiffe://apps.../ns/user1-hermes/sa/hermes-agent</tspan><tspan x="610.0" dy="18.8">aud: [keycloak realm URL]</tspan><tspan x="610.0" dy="18.8">exp: iat + 5m</tspan><tspan x="610.0" dy="18.8">iat: 1795600000</tspan><tspan x="610.0" dy="18.8">iss: https://oidc-discovery.apps...</tspan></text>
<rect x="880" y="170" width="260" height="220" rx="10" fill="#f3d9fa" stroke="#9c36b5" stroke-width="2"/>
<text x="1010.0" y="245.2" font-size="16" fill="#9c36b5" text-anchor="middle"><tspan x="1010.0" dy="0.0">SIGNATURE</tspan><tspan x="1010.0" dy="20.0"> </tspan><tspan x="1010.0" dy="20.0">SPIRE Server</tspan><tspan x="1010.0" dy="20.0">JWT key</tspan><tspan x="1010.0" dy="20.0">(public half in JWKS)</tspan></text>
<rect x="40" y="430" width="300" height="100" rx="10" fill="#fff9db" stroke="#5c5f66" stroke-width="2"/>
<text x="190.0" y="475.5" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="190.0" dy="0.0">kid -&gt; pick key</tspan><tspan x="190.0" dy="18.8">in the JWKS</tspan></text>
<rect x="380" y="430" width="460" height="100" rx="10" fill="#fff9db" stroke="#5c5f66" stroke-width="2"/>
<text x="610.0" y="466.1" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="610.0" dy="0.0">sub = WHO (picked by SPIRE)</tspan><tspan x="610.0" dy="18.8">aud = FOR WHOM (picked by the caller)</tspan><tspan x="610.0" dy="18.8">exp = 5 minutes, then useless</tspan></text>
<rect x="880" y="430" width="300" height="100" rx="10" fill="#fff9db" stroke="#5c5f66" stroke-width="2"/>
<text x="1030.0" y="475.5" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="1030.0" dy="0.0">verify with</tspan><tspan x="1030.0" dy="18.8">/.well-known -&gt; jwks_uri</tspan></text>
<rect x="40" y="570" width="1100" height="90" rx="10" fill="#ffe3e3" stroke="#c92a2a" stroke-width="2"/>
<text x="590.0" y="610.2" font-size="16" fill="#c92a2a" text-anchor="middle"><tspan x="590.0" dy="0.0">NOT inside: roles, scopes, username, azp, jti. A JWT-SVID says WHICH SOFTWARE this is,</tspan><tspan x="590.0" dy="20.0">not what it may do. Permissions come from Keycloak / Authorino.</tspan></text>
</svg>