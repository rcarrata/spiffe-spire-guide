<text x="790.0" y="529.4" font-size="13" fill="#5c5f66" text-anchor="middle"><tspan x="790.0" dy="0.0">Authorino AuthPolicy</tspan><tspan x="790.0" dy="16.2">1. JWT from realm</tspan><tspan x="790.0" dy="16.2">2. tool:X in roles</tspan><tspan x="790.0" dy="16.2">3. azp = agent (new CEL)</tspan></text>
