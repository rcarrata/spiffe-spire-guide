<rect x="0" y="-10" width="1393" height="660" fill="#ffffff"/>
<text x="40.0" y="32.8" font-size="24" fill="#1e1e1e" text-anchor="start"><tspan x="40.0" dy="0.0">OpenShell sandbox -&gt; supervisor -&gt; gateway -&gt; Keycloak -&gt; MCP Gateway (target, OpenShell &gt;= v0.0.113)</tspan></text>
