<text x="280.0" y="501.8" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="280.0" dy="0.0">Sandbox never holds: the JWT-SVID,</tspan><tspan x="280.0" dy="18.8">the Keycloak token, any secret.</tspan><tspan x="280.0" dy="18.8">It only sees an opaque placeholder</tspan><tspan x="280.0" dy="18.8">(same trick as --provider maas in Module 2).</tspan></text>
